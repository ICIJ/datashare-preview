[tool.poetry]
name = "datashare-preview"
version = "1.6.3"
description = ""
authors = ["ICIJ <engineering@icij.org>"]
readme = "README.rst"
packages = [{include = "dspreview"}] 

[tool.poetry.dependencies]
aiofiles = "^25.1.0"
fastapi = "^0.162.6"
fastapi-utils = {extras = ["all"], version =  "^0.8.0"}
httpx = "^0.28.1"
preview-generator = {extras = ["all"], version = "^0.29"}
pydantic = "^2.14.3"
pydantic-settings = "^2.16.3"
pygelf = "^0.4.3"
python = ">=3.11,<4.0"
uvicorn = {extras = ["standard"], version = "^0.54.0"}
