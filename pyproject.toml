[project]
name = "datashare-preview"
version = "1.6.3"
description = ""
authors = [{name = "ICIJ", email = "engineering@icij.org"}]
readme = "README.rst"
requires-python = ">=3.11,<4.0"
dependencies = [
  "aiofiles (>=25.1.0,<26.0.0)",
  "fastapi (>=0.162.6,<0.163.0)",
  "fastapi-utils[all] (>=0.8.0,<0.9.0)",
  "httpx (>=0.28.1,<0.29.0)",
  "preview-generator[all] (>=0.29,<0.30)",
  "pydantic (>=2.14.3,<3.0.0)",
  "pydantic-settings (>=2.16.3,<3.0.0)",
  "pygelf (>=0.4.3,<0.5.0)",
  "uvicorn[standard] (>=0.54.0,<0.55.0)",
  "setuptools (>=84.2.1,<85.0.0)",
]

[tool.poetry]
packages = [{include = "dspreview"}]

[tool.poetry.group.dev.dependencies]
pytest = "^9.2.0"
nose = "^1.3.7"
respx = "^0.23.1"
requests = "^2.34.2"
httpx2 = "^2.16.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
